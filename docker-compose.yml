services:
  # MariaDB Service
  # ??? gua nge setup nya langsung defaultnya njr. sederhana doang.
  mariadb-contact-form:
    image: mariadb:latest
    container_name: mariadb-contact-form
    restart: on-failure
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD} # ??? bedanya sama mysql_password biasa apa?
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    # ports:
    #   - "${HOST_MARIADB_PORT}:${CONT_MARIADB_PORT}"
    ports:
     - "3306:3306"
    volumes:
      - mariadb-contact-form-data:/var/lib/mysql
    networks:
      - contact-form-network-database

  # PHPMyAdmin Service
  #??? ini juga smaa gua setup nya sederhana doang
  phpmyadmin-contact-form:
    image: phpmyadmin/phpmyadmin:latest
    platform: linux/amd64
    container_name: phpmyadmin-contact-form
    restart: on-failure
    environment:
      - PMA_HOST=mariadb-contact-form
      - PMA_PORT=${CONT_MARIADB_PORT}
    env_file:
      - .env
    ports:
      - "${HOST_PHPMYADMIN_PORT}:${CONT_PHPMYADMIN_PORT}"
    depends_on:
      - mariadb-contact-form
    networks:
      - contact-form-network-database

  # API Contact Form Service
  api-contact-form:
    build: .
    image: api-contact-form:1.0.0
    container_name: api-contact-form
    restart: on-failure # ??? selain onfailure, ada apa lagi
    depends_on:
      - mariadb-contact-form
    env_file: # ??? ini maksudnbya apa? bikin file kah?
      - .env
    ports:
      - "${HOST_API_PORT}:${CONT_API_PORT}"
    environment:
      - APP_PORT=${CONT_API_PORT}
      - APP_TIMEZONE=Asia/Jakarta
      - DB_HOST=mariadb-contact-form
      - DB_PORT=${CONT_MARIADB_PORT}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - CORS_ALLOWED_ORIGINS=http://localhost:8081,http://localhost:8082,http://cms-contact-form:8081,http://client-contact-form:8082
      - CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - CORS_ALLOWED_HEADERS=Origin,Content-Type,Accept,Authorization
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_EXPOSE_HEADERS=Content-Length,Content-Type
    networks:
      - contact-form-network-database

volumes: # ??? volume untuk apa? kenapa formatnya mariadb-contact-form-data nya itu kosongan? apa jgn jgn isinya itu network, soalnya di tutorial lane nya mariadbp-contact-form-data dengan networks itu setara
  mariadb-contact-form-data:

networks: # ??? nerworks fungsinya apa njr
  contact-form-network-database:
    driver: bridge # ??? ini kenapa driver bridge, emang ada apa aja.
